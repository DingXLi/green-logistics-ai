# pytest configuration (iter #36)
#
# Defines custom markers used by CI to split the test suite into parallel
# jobs (fast unit tests vs. slow integration tests vs. LLM-gated tests).
#
# Without these markers, every PR must run the entire suite serially in
# one job, which exceeds the 5-minute cron budget used by the autonomous
# iteration loop and slows PR feedback.
#
# Usage locally:
#   pytest -m "not slow and not llm"       # fast tests only (~30s)
#   pytest -m "slow"                       # OR-Tools / heavy integration
#   pytest -m "llm"                        # requires GOOGLE_API_KEY
#   pytest -m "not llm"                    # everything except LLM-gated
#
# Adding a marker to a test module:
#   pytestmark = pytest.mark.slow
#
# Adding a marker to a single test:
#   @pytest.mark.slow
#   def test_something_heavy():
#       ...

[pytest]
markers =
    slow: marks tests as slow (OR-Tools optimization, large coordinator integration, >5s wall-clock)
    llm: marks tests that require a live GOOGLE_API_KEY (real Gemini calls)
asyncio_mode = auto
testpaths = tests
addopts = -ra --strict-markers
