name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# iter #36: Split monolithic test job into parallel jobs to keep CI wall-clock
# under the 5-minute cron budget used by the autonomous iteration loop.
#
# Before: one `test` job ran lint + mypy + security + ALL pytest serially,
# taking >5 min on a full suite and >7 min on the slow OR-Tools integration.
#
# After: 3 parallel jobs (lint, fast-tests, slow-tests) + LLM-gated job,
# all sharing pip cache. Each finishes in <3 min; total wall-clock ~5 min.
#
# The split uses pytest markers (see pytest.ini):
#   -m "not slow"  → fast unit tests (default)
#   -m "slow"      → OR-Tools / heavy integration
#   -m "llm"       → reserved for future LLM-gated tests

jobs:
  lint:
    name: Lint + type-check + security (iter #36: parallel)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 agents/ optimization/ synthetic/ data/ web/backend/ \
          --count --select=E9,F63,F7,F82 --show-source --statistics
        # Style errors as warnings (don't fail build)
        flake8 agents/ optimization/ synthetic/ data/ web/backend/ \
          --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type-check with mypy (iter #13)
      run: |
        pip install mypy
        # Non-strict mode to avoid breaking on third-party libs (google-genai etc.)
        # Fail on real type errors in our own code
        MYPYPATH=. mypy agents/ optimization/ web/backend/ data/real_sweden_facilities.py data/swedish_waste_stats.py data/seasonal_adjuster.py \
          --ignore-missing-imports \
          --no-strict-optional \
          --explicit-package-bases

    - name: Complexity ratchet gate (iter #84)
      run: |
        # 圈复杂度棘轮 (ADR-0016): 已有的函数**不许变难**, 新函数必须 ≤ 10。
        # 红灯条件: 某个函数复杂度比基线高 / 新函数超阈值 / 基线里的函数消失了。
        # 现状: 486 个函数里还有 49 个超阈值 —— 这条门禁不是要一次还完,
        # 是要让「还债」变成可测量的、可评审的日常 (债务只许降, 不许涨)。
        # 故意改复杂时: python scripts/gen_complexity_baseline.py --write + 在 PR 里说明。
        python scripts/gen_complexity_baseline.py

    - name: Loose assertion gate (iter #86)
      run: |
        # 松断言门禁 (ADR-0018): 一个断言同时接受多个结果 = 没有断言。
        # 红灯条件: 出现「同时接受多个状态码」的断言 / 断言写在「看结果再决定要不要断言」
        # 的守卫里 / 登记册有陈旧豁免 / 一个文件都没扫到 (fail-closed)。
        # 背景: ADR-0017 的顺序门禁上线当天抓到的 bug, 根因之一就是
        #       `assert resp.status_code in (200, 503)` —— 端点整个挂掉测试照样绿。
        # 故意写松断言时: 这一步会红。
        python scripts/loose_assert_lint.py

    - name: Security scan dependencies (iter #16)
      run: |
        # Try pip-audit (canonical), fall back to heuristic scanner in scripts/security_scan.sh
        pip install pip-audit 2>/dev/null || echo "pip-audit unavailable, using fallback"
        bash scripts/security_scan.sh || echo "security scan found issues (non-fatal — see logs)"

  fast-tests:
    name: Fast unit tests (iter #36: -m "not slow")
    runs-on: ubuntu-latest
    strategy:
      # iter #74: fail-fast=false —— 之前 3.11 档挂了会把 3.12 档直接 cancel 掉,
      # 导致真正的失败原因被掩盖 (只看到一档红)。各版本独立报结果。
      fail-fast: false
      matrix:
        # iter #74: 补 3.13 —— 与本地开发环境 (venv 3.13.5) 一致, 测你真正在跑的版本
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Seed CI fixture DB (iter #74)
      run: |
        # data/*.db 被 .gitignore 排除 → fresh checkout 里没有 DB。
        # 依赖「已有多天历史」的 dashboard / forecast 测试在 CI 必挂
        # (need >= 2 cycles / confidence 为空) —— 这里造一份确定性合成 fixture。
        python scripts/seed_ci_fixture.py

    - name: Test with pytest (fast only) + coverage (iter #36)
      run: |
        pip install pytest pytest-asyncio pytest-cov pytest-timeout
        # iter #36: split into fast + slow jobs. -m "not slow" excludes
        # pytestmark = pytest.mark.slow modules (OR-Tools integration,
        # coordinator bootstrap, heavy DB perf benchmarks).
        # pytest-timeout gives every test a hard wall-clock budget; prevents
        # a single hanging optimization from blocking the entire CI matrix.
        # iter #74: 60 → 120 秒 —— 最重的两个集成用例在慢 runner 上会擦到 60s
        # (test_seasonal_adjuster ~40s / test_seasonal_persistence ~37s)，加上
        # coverage 追踪的额外开销，60s 太贴边、容易假失败。
        pytest tests/ \
          --ignore=tests/test_llm_integration.py \
          -m "not slow" \
          --timeout=120 \
          --timeout-method=thread \
          --cov=agents --cov=optimization --cov=data --cov=web/backend \
          --cov-report=term-missing \
          --cov-report=xml:coverage.xml \
          --cov-fail-under=35 \
          -v \
          --tb=short \
          --maxfail=5
      # coverage 报告: term-missing 给每个未覆盖的行号, xml 供 Codecov 上传
      # 35% 阈值: 现状 39% (as of iter #14), 随新测试递增

    - name: Public API contract gate (iter #78)
      run: |
        # 公开 API 契约: 把「重构不改公开面」变成 CI 里的常驻不变量 (ADR-0010)。
        # 任何方法增删 / 参数改名 / 默认值改动 / 公开常量变形 都会让这一步失败。
        # 故意改 API 时: python scripts/gen_api_contract.py --write + 在 PR 里说明。
        python scripts/gen_api_contract.py

    - name: HTTP API contract gate (iter #79)
      run: |
        # HTTP 面契约: 客户调的那层接口也冻结 (ADR-0011)。
        # 端点增删 / 路径改名 / 状态码 / 参数必填性 / 响应模型字段 /
        # **admin 鉴权依赖被摘掉** —— 任何一条都会让这一步失败。
        # 故意改 API 时: python scripts/gen_http_contract.py --write + 在 PR 里说明。
        python scripts/gen_http_contract.py

    - name: Endpoint policy gate (iter #81)
      run: |
        # 端点策略: 自动发现 + 显式豁免登记册的 fail-closed 校验 (ADR-0013)。
        # 每个 GET 端点必须「被采集」或「被显式豁免」, 不允许沉默的缺口;
        # 陈旧豁免 / 非法豁免理由 / 缺说明 都会让这一步失败。
        python scripts/endpoint_policy.py

    - name: HTTP payload shape gate (iter #80)
      run: |
        # 响应体运行时形状契约: 补上 ADR-0011 自己写下的已知边界
        # (绝大多数端点响应是 Dict[str, Any], OpenAPI 对响应体字段是瞎的)。
        # **字段被删 / 类型被加宽(原来 integer 现在可能是 null) / 类型被替换**
        # —— 任何一条都会让这一步失败; 新增字段只打印不阻断。
        # 故意改响应体结构时: python scripts/gen_payload_shapes.py --write + 在 PR 里说明。
        python scripts/gen_payload_shapes.py

    - name: Export column contract gate (iter #82)
      run: |
        # 导出列契约: 补上 ADR-0013 留下的欠条 —— 那 14 个导出端点当时被豁免,
        # 备注写着「字段契约是列名」, 但列名从来没被冻过。
        # **列被删 / 列被改名 / CSV 列顺序变了 / 有序格式中间插了一列 /
        #   Parquet 列类型变了** —— 任何一条都会让这一步失败; 末尾新增列只打印。
        # 另有一层**不需要基线**的结构不变量: 同一张表在不同导出格式下,
        # 列集合必须一致 (客户换个格式下载就少列/多列)。
        # 故意改导出列时: python scripts/gen_export_contracts.py --write + 在 PR 里说明。
        python scripts/gen_export_contracts.py

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: coverage.xml
        flags: unittests
        fail_ci_if_error: false  # 不要让 Codecov 错误卡住 CI

  test-order:
    name: Test order independence (iter #85: ADR-0017)
    runs-on: ubuntu-latest
    # 独立 job, 不阻塞主测试反馈环 —— 顺序扰动是**加固**, 不是阻断 PR 的第一道闸。
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-timeout

    - name: Seed CI fixture DB (iter #85)
      run: |
        # 必须先造确定性 fixture (ADR-0006) —— 否则「换一个顺序」会把
        # 「fixture 本身不确定」误判成「测试顺序依赖」。
        python scripts/seed_ci_fixture.py

    - name: Test order independence gate (iter #85)
      run: |
        # 测试顺序无关性门禁 (ADR-0017): 把「CI 绿灯」从运气变成证据。
        # 用 3 个可复现 seed 打乱**嫌疑队列**(直接写 ambient 全局单例的测试文件)
        # 的执行顺序, 逐个 testcase 比对 outcome —— 任何「换序就翻转」的结果都判红。
        # 背景: iter #84 的复杂度棘轮门禁当天抓到「pytest tests/ -k forecast」红、
        #       「pytest tests/」全绿 的顺序依赖 bug —— CI 只证明了「按这个顺序是绿的」。
        # 故意让测试依赖执行顺序时: 这一步会红。
        python scripts/test_order_gate.py --seeds 101,202,303

  slow-tests:
    name: Slow integration tests (iter #36: -m slow, OR-Tools)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]  # slow: only newest py to halve matrix

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test slow suite (OR-Tools / coordinator / perf)
      run: |
        pip install pytest pytest-asyncio pytest-timeout
        # iter #36: slow tests run in their own job so they don't block the
        # fast feedback loop on PRs. Modules marked with pytestmark = slow:
        #   - test_vrp_real_distance.py  (OR-Tools path optimization)
        #   - test_agents.py             (full coordinator bootstrap + cycle)
        #   - test_supply_cohort.py      (multi-hundred-row DB writes)
        #   - test_persistence_efficiency.py (perf benchmarks)
        pytest tests/ \
          -m "slow" \
          --timeout=180 \
          --timeout-method=thread \
          -v \
          --tb=short \
          --maxfail=3
      # --maxfail=3: stop early on cascading failures (e.g. DB schema bug)

  llm-tests:
    name: LLM integration tests (iter #36: requires GOOGLE_API_KEY)
    runs-on: ubuntu-latest
    # LLM tests only run on main branch with secret available
    if: github.ref == 'refs/heads/main'
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test LLM integration (with API key)
      run: |
        pip install pytest pytest-asyncio pytest-timeout
        if [ -n "$GOOGLE_API_KEY" ]; then
          pytest tests/test_llm_integration.py --timeout=90 --timeout-method=thread -v --tb=short
        else
          echo "GOOGLE_API_KEY not set - skipping LLM integration tests"
        fi
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

  docker-build:
    runs-on: ubuntu-latest
    # iter #36: wait for all parallel jobs before building docker image
    needs: [lint, fast-tests, slow-tests]

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -f Dockerfile.backend -t green-logistics-backend:test .

    - name: Test Docker image
      run: |
        docker run --rm green-logistics-backend:test echo "Docker build successful"

  deploy-preview:
    runs-on: ubuntu-latest
    # 部署必须过顺序无关性门禁 (ADR-0017) —— 但**不阻塞 PR 的 docker build**。
    # 理由: 顺序扰动是「加固」而非「第一道闸」, PR 反馈环要快;
    #       但**上 main 的代码必须证明自己的测试是可靠的**。
    needs: [lint, fast-tests, slow-tests, docker-build, test-order]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy notification
      run: |
        echo "✅ Build successful!"
        echo "📦 Ready for deployment"
        echo "🔗 Repository: https://github.com/${{ github.repository }}"
