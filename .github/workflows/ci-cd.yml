name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 agents/ optimization/ synthetic/ data/ web/backend/ \
          --count --select=E9,F63,F7,F82 --show-source --statistics
        # Style errors as warnings (don't fail build)
        flake8 agents/ optimization/ synthetic/ data/ web/backend/ \
          --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type-check with mypy (iter #13)
      run: |
        pip install mypy
        # Non-strict mode to avoid breaking on third-party libs (google-generativeai etc.)
        # Fail on real type errors in our own code
        MYPYPATH=. mypy agents/ optimization/ web/backend/ data/real_sweden_facilities.py data/swedish_waste_stats.py data/seasonal_adjuster.py \
          --ignore-missing-imports \
          --no-strict-optional \
          --explicit-package-bases

    - name: Test with pytest + coverage (iter #14)
      run: |
        pip install pytest pytest-asyncio pytest-cov
        # 跳过 OR-Tools 慢测试 (test_pareto_front ~15s) 和 需要 LLM 的测试
        pytest tests/ \
          --ignore=tests/test_llm_integration.py \
          -k "not test_pareto_front" \
          --cov=agents --cov=optimization --cov=data --cov=web/backend \
          --cov-report=term-missing \
          --cov-report=xml:coverage.xml \
          --cov-fail-under=35 \
          -v \
          --tb=short \
          --maxfail=5
      # coverage 报告: term-missing 给每个未覆盖的行号, xml 供 Codecov 上传
      # 35% 阈值: 现状 39% (as of iter #14), 随新测试递增

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: coverage.xml
        flags: unittests
        fail_ci_if_error: false  # 不要让 Codecov 错误卡住 CI

    - name: Test LLM integration (with API key)
      run: |
        pip install pytest pytest-asyncio
        if [ -n "$GOOGLE_API_KEY" ]; then
          pytest tests/test_llm_integration.py -v --tb=short
        else
          echo "GOOGLE_API_KEY not set - skipping LLM integration tests"
        fi
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -f Dockerfile.backend -t green-logistics-backend:test .

    - name: Test Docker image
      run: |
        docker run --rm green-logistics-backend:test echo "Docker build successful"

  deploy-preview:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy notification
      run: |
        echo "✅ Build successful!"
        echo "📦 Ready for deployment"
        echo "🔗 Repository: https://github.com/${{ github.repository }}"
