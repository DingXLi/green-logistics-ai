name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        pip install pytest pytest-asyncio
        # 跳过 OR-Tools 慢测试 (test_pareto_front ~15s) 和 需要 LLM 的测试
        pytest tests/ \
          --ignore=tests/test_llm_integration.py \
          -k "not test_pareto_front" \
          -v \
          --tb=short \
          --maxfail=5

    - name: Test LLM integration (with API key)
      run: |
        pip install pytest pytest-asyncio
        if [ -n "$GOOGLE_API_KEY" ]; then
          pytest tests/test_llm_integration.py -v --tb=short
        else
          echo "GOOGLE_API_KEY not set - skipping LLM integration tests"
        fi
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -f Dockerfile.backend -t green-logistics-backend:test .

    - name: Test Docker image
      run: |
        docker run --rm green-logistics-backend:test echo "Docker build successful"

  deploy-preview:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy notification
      run: |
        echo "✅ Build successful!"
        echo "📦 Ready for deployment"
        echo "🔗 Repository: https://github.com/${{ github.repository }}"
